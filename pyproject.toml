[project]
name = "kleomarcus-announcer"
version = "0.1.0"
description = "Scheduled lobby voice announcements for Kleomarcus Spor Akademi."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samet Polat" }]
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "platformdirs>=4.14.5",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-openpyxl>=3.1.5",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv]
# uv-managed CPython bundles Tcl/Tk; some system Pythons (e.g. Homebrew) do not.
python-preference = "only-managed"

[tool.uv.build-backend]
module-name = "announcer"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]
# Turkish text is expected here; the dotless "ı" is not a typo for "i".
allowed-confusables = ["ı"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

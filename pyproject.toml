[project]
name = "kleomarcus-announcer"
version = "0.1.0"
description = "Calls every athlete by name, right on time: lobby announcements for Kleomarcus Spor Akademi."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samet Polat" }]
requires-python = ">=3.14"
keywords = ["announcements", "text-to-speech", "scheduler", "tkinter", "excel"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Turkish",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "edge-tts>=7.3.1",
  "openpyxl>=3.1.5",
  "platformdirs>=4.14.5",
  "pygame-ce>=2.5.8",
]

[project.urls]
Repository = "https://github.com/sametpolat7/kleomarcus-announcer"
Issues = "https://github.com/sametpolat7/kleomarcus-announcer/issues"

[project.gui-scripts]
kleomarcus-announcer = "announcer.__main__:main"

[dependency-groups]
dev = [
  "mypy>=2.4.1",
  "pytest>=9.2.0",
  "ruff>=0.17.4",
  "types-openpyxl>=3.1.5",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv]
# uv-managed CPython bundles Tcl/Tk; some system Pythons (e.g. Homebrew) do not.
python-preference = "only-managed"

[tool.uv.build-backend]
module-name = "announcer"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "PTH", # flake8-use-pathlib
  "RUF", # ruff-specific rules
]
# Turkish text is expected here; the dotless "ı" is not a typo for "i".
allowed-confusables = ["ı"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
